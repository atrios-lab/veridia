name: verify

on:
  pull_request:
  push:
    branches: [main]

# A new commit on the same pull request cancels the run already in flight.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Throwaway values, not secrets: `src/lib/auth.ts` refuses to load
    # without them, and `pnpm build` imports it. No nível do job porque é o
    # único passo que precisa deles.
    env:
      BETTER_AUTH_SECRET: build-sem-valor-nenhum-fora-deste-processo
      BETTER_AUTH_URL: http://localhost:3000
      DEFAULT_TENANT: cartorio-marinho
    # No secrets, by design, and no serviço de banco: pnpm test roda inteiro
    # contra PostgreSQL em processo (PGlite, ver src/db/test-db.ts), e não há
    # mais suíte de browser que precise de um banco de verdade ao lado.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Exactly the lockfile: the result must not change because a transitive
      # dependency published a new version overnight.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:dashes
      - run: pnpm check:tokens
      - run: pnpm check:destructive

      - name: openspec validate
        # Pinned: an unpinned validator turns someone else's release into a
        # red build on a pull request that touched nothing.
        run: pnpm dlx @fission-ai/openspec@1.5.0 validate --all

      - run: pnpm build
